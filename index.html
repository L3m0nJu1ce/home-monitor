<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Home Monitor</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --line:#262c38; --text:#e8ebf2; --muted:#8b93a5;
    --accent:#7cc4a4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:22px;margin:8px 0 4px;font-weight:650;letter-spacing:-.01em}
  p{margin:6px 0;color:var(--muted)}
  button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);
    color:#08130e;font-weight:600;cursor:pointer;width:100%}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:#0e1118;color:var(--text);margin:6px 0 10px}
  .hidden{display:none!important}

  #view{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
  #vid{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  #vid.boost{filter:brightness(1.9) contrast(1.15)}
  #bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0b0d12;
    border-top:1px solid var(--line)}
  #bar button{padding:11px 6px;font-size:14px}
  #status{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;
    text-align:center;font-size:14px;color:var(--text);text-shadow:0 1px 3px #000}
  .pill{display:inline-block;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px}
</style>
</head>
<body>

<div id="intro" class="wrap hidden">
  <h1>Home Monitor</h1>
  <p>Open the Home Monitor app on the camera phone. It shows your private viewer link.</p>
</div>

<div id="pinGate" class="wrap hidden">
  <h1>Home Monitor</h1>
  <p>Enter the PIN you set in the app on the camera phone.</p>
  <input id="pinIn" inputmode="numeric" maxlength="8" placeholder="PIN">
  <button id="pinGo">Connect</button>
</div>

<div id="view" class="hidden">
  <video id="vid" playsinline autoplay></video>
  <div id="status"><span class="pill" id="vStatus">Connecting…</span></div>
  <div id="bar">
    <button id="bSound" class="ghost">🔇 Sound</button>
    <button id="bBoost" class="ghost">🌙 Night</button>
    <button id="bFlip" class="ghost">🔄 Flip</button>
    <button id="bEnd">End</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const show = id => ["intro","pinGate","view"].forEach(x => $(x).classList.toggle("hidden", x !== id));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  // must match Prefs.PEER_PREFIX in the Android app
  const PREFIX = "homemon-v2-";
  const SIGNAL_URL = "wss://0.peerjs.com/peerjs";
  // Add a TURN relay here (and in the app) if watching over mobile data or the work network fails.
  const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    // { urls: "turn:YOUR_TURN_HOST:443?transport=tcp", username: "USER", credential: "PASS" },
  ];
  const viewCode = new URLSearchParams(location.hash.slice(1)).get("watch");
  const camId = PREFIX + viewCode;

  async function sha(s){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
  }
  function rid(n){
    const a = new Uint8Array(n); crypto.getRandomValues(a);
    return [...a].map(x => "abcdefghjkmnpqrstuvwxyz23456789"[x % 31]).join("");
  }
  function vStatus(t, hideAfter){
    $("vStatus").textContent = t; $("status").classList.remove("hidden");
    if (hideAfter) setTimeout(() => $("status").classList.add("hidden"), hideAfter);
  }

  /* Signalling goes through the PeerJS server, which relays {type, dst, payload} to the camera app.
     The server closes the socket unless payloads carry PeerJS's own fields, so every payload has
     type + connectionId, SDPs are {type, sdp} objects and candidates are objects. */
  let ws, pc, dc, sid, hb, timer, ended = false, offerSent = false, remoteReady = false;
  const localQueue = [], remoteQueue = [];

  function send(type, payload){
    payload = { type: "media", connectionId: "mc_" + sid, sid, ...payload };
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type, dst: camId, payload }));
  }

  function start(pinHash){
    show("view"); vStatus("Connecting…");
    sid = rid(10);
    ws = new WebSocket(`${SIGNAL_URL}?key=peerjs&id=homemon-v-${rid(16)}&token=${rid(10)}&version=1.5.5`);
    ws.onmessage = e => { try { onSignal(JSON.parse(e.data), pinHash); } catch {} };
    ws.onclose = () => { clearInterval(hb); if (!ended && !(pc && pc.connectionState === "connected")) vStatus("Connection problem — tap End and reopen"); };
  }

  async function onSignal(m, pinHash){
    const p = m.payload || {};
    if (m.type === "OPEN") {
      hb = setInterval(() => ws.send('{"type":"HEARTBEAT"}'), 5000);
      await call(pinHash);
    } else if (m.type === "ANSWER" && p.sid === sid) {
      await pc.setRemoteDescription(p.sdp);
      remoteReady = true;
      for (const c of remoteQueue.splice(0)) pc.addIceCandidate(c).catch(() => {});
    } else if (m.type === "CANDIDATE" && p.sid === sid) {
      // the app refuses a viewer with an empty candidate carrying {error}
      if (p.error) return onError(p.error);
      if (remoteReady) pc.addIceCandidate(p.candidate).catch(() => {}); else remoteQueue.push(p.candidate);
    } else if (m.type === "EXPIRE") {
      clearTimeout(timer); vStatus("Camera phone is offline — is the app running?");
    } else if (m.type === "ERROR" || m.type === "ID-TAKEN") {
      vStatus("Connection problem — tap End and reopen");
    }
  }

  async function call(pinHash){
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    dc = pc.createDataChannel("ctl");
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const c = { candidate: { candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex } };
      // the app ignores candidates for a session it hasn't seen an offer for yet
      if (offerSent) send("CANDIDATE", c); else localQueue.push(c);
    };
    pc.ontrack = e => {
      const v = $("vid"), s = e.streams[0] || new MediaStream([e.track]);
      if (v.srcObject !== s) { v.srcObject = s; v.muted = $("bSound").dataset.on !== "1"; v.play().catch(() => {}); }
    };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") { clearTimeout(timer); vStatus("Live", 2500); }
      else if (s === "disconnected") vStatus("Reconnecting…");
      else if (s === "failed") vStatus("Couldn't reach the camera — this network may block it (needs a TURN relay)");
    };
    await pc.setLocalDescription(await pc.createOffer());
    send("OFFER", { sdp: { type: "offer", sdp: pc.localDescription.sdp }, metadata: {}, proto: "homemon2", pin: pinHash });
    offerSent = true;
    for (const c of localQueue.splice(0)) send("CANDIDATE", c);
    timer = setTimeout(() => { if (pc.connectionState !== "connected") vStatus("Camera phone not reachable — is the app running and online?"); }, 20000);
  }

  function onError(err){
    clearTimeout(timer);
    if (err === "denied") { store.set(PREFIX+"vpin-"+viewCode, ""); vStatus("Wrong PIN"); setTimeout(() => location.reload(), 1500); }
    else if (err === "locked") vStatus("Too many wrong PINs — try again in a minute");
    else vStatus("The camera couldn't start — open the app on the camera phone once");
  }

  function bye(){ try { dc && dc.readyState === "open" && dc.send("bye"); } catch {} }

  function endViewer(){
    ended = true; bye(); clearTimeout(timer); clearInterval(hb);
    setTimeout(() => {
      try { pc && pc.close(); ws && ws.close(); } catch {}
      $("vid").srcObject = null; vStatus("Ended — reopen link to watch again");
    }, 200);
  }
  window.addEventListener("pagehide", bye);

  $("bSound").onclick = () => {
    const v = $("vid"); v.muted = !v.muted; $("bSound").dataset.on = v.muted ? "" : "1";
    $("bSound").textContent = v.muted ? "🔇 Sound" : "🔊 Sound";
  };
  $("bBoost").onclick = () => $("vid").classList.toggle("boost");
  $("bFlip").onclick = () => { try { dc.send("flip"); } catch {} };
  $("bEnd").onclick = endViewer;

  if (!viewCode) { show("intro"); return; }
  const saved = store.get(PREFIX+"vpin-"+viewCode);
  if (saved) start(saved);
  else {
    show("pinGate");
    $("pinGo").onclick = async () => {
      const p = $("pinIn").value.trim(); if (!p) return;
      const h = await sha(viewCode + ":" + p);
      store.set(PREFIX+"vpin-"+viewCode, h); start(h);
    };
  }
})();
</script>
</body>
</html>
